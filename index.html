<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="网站已迁移至 goofish.win，请收藏新地址。">
  <link rel="icon" href="data:,">
  <title>网站已迁移 · goofish.win</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #151617; color: #f5f6f7; }
    body {
      background: #151617;
      color: #f5f6f7;
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      font: 15px/1.7 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main { width: 100%; max-width: 440px; }
    .brand {
      margin: 0 0 48px;
      color: #d0d4d8;
      font-size: 14px;
      letter-spacing: .04em;
    }
    h1 { color: #f5f6f7; margin: 0 0 12px; font-size: 32px; line-height: 1.3; font-weight: 600; letter-spacing: -.03em; }
    .intro { margin: 0; color: #d0d4d8; }
    .address { margin: 32px 0 24px; padding: 20px 0; border-block: 1px solid #343738; }
    .label { display: block; margin-bottom: 6px; color: #d0d4d8; font-size: 13px; }
    .url { color: #b8ddff; font-size: clamp(23px, 6vw, 28px); font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
    .url:hover { text-decoration: underline; text-underline-offset: 5px; }
    .status { min-height: 26px; margin: 0 0 24px; color: #d0d4d8; font-size: 14px; }
    #countdown { color: #f5f6f7; font-variant-numeric: tabular-nums; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
    .visit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 20px;
      border: 1px solid #d9ddd6;
      border-radius: 5px;
      background: #d9ddd6;
      color: #191c19;
      font-weight: 600;
      text-decoration: none;
    }
    .visit:hover { background: #eef0eb; border-color: #eef0eb; }
    button {
      min-height: 44px;
      padding: 8px 0;
      border: 0;
      background: transparent;
      color: #d0d4d8;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { color: #f5f6f7; }
    :focus-visible { outline: 2px solid #b8c8ab; outline-offset: 5px; }
    [hidden] { display: none !important; }
    footer { margin-top: 48px; color: #d0d4d8; font-size: 14px; }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <p class="brand">goofish.win</p>
    <h1 id="title">我们换了个新地址。</h1>
    <p class="intro">网站已迁移，请收藏下方地址，方便下次访问。</p>
    <div class="address">
      <span class="label">新的访问地址</span>
      <a class="url" id="destination" href="https://goofish.win">https://goofish.win</a>
    </div>
    <p class="status" id="status" role="status" aria-live="polite" aria-atomic="true" hidden>
      <span id="countdown">3</span> 秒后自动前往新网站
    </p>
    <noscript><p class="status">请点击下方按钮访问新网站。</p></noscript>
    <div class="actions">
      <a class="visit" href="https://goofish.win">立即访问</a>
      <button id="cancel" type="button" hidden>留在此页</button>
    </div>
    <footer>如果没有自动跳转，点击「立即访问」即可。</footer>
  </main>
  <script>
    (() => {
      'use strict';
      const status = document.getElementById('status');
      const countdown = document.getElementById('countdown');
      const cancel = document.getElementById('cancel');
      const destination = document.getElementById('destination').href;
      const deadline = performance.now() + 3000;
      let timer;
      let stopped = false;

      function stop() {
        if (stopped) return;
        stopped = true;
        clearTimeout(timer);
        status.textContent = '已取消自动跳转，可手动访问新网站。';
        cancel.hidden = true;
      }

      function tick() {
        if (stopped) return;
        const remaining = deadline - performance.now();
        if (remaining <= 0) {
          stopped = true;
          cancel.hidden = true;
          status.textContent = '正在前往新网站…';
          window.location.replace(destination);
          return;
        }
        countdown.textContent = Math.ceil(remaining / 1000);
        timer = setTimeout(tick, Math.min(1000, remaining));
      }

      cancel.addEventListener('click', stop);
      window.addEventListener('pagehide', stop, { once: true });
      status.hidden = false;
      cancel.hidden = false;
      tick();
    })();
  </script>
</body>
</html>
