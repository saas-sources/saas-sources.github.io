<!DOCTYPE html>
<html lang="zh-CN">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5; url=https://goofish.win">
    <title>网站已迁移 - goofish.win</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
        
        :root {
            --primary: #3b82f6;
        }
        
        body {
            font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
        }
        
        .redirect-card {
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .countdown-number {
            font-variant-numeric: tabular-nums;
            transition: all 0.3s ease;
        }
        
        .site-url {
            word-break: break-all;
            transition: color 0.2s ease;
        }
        
        .site-url:hover {
            color: #2563eb;
        }
        
        .modern-button {
            transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .modern-button:active {
            transform: scale(0.985);
        }
        
        .fade-in {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <!-- Main Card -->
            <div class="redirect-card bg-zinc-900 border border-zinc-800 rounded-3xl p-8 md:p-10 fade-in">
                
                <!-- Header Icon -->
                <div class="flex justify-center mb-6">
                    <div class="w-16 h-16 bg-blue-500/10 rounded-2xl flex items-center justify-center">
                        <i class="fa-solid fa-globe text-blue-500 text-4xl"></i>
                    </div>
                </div>
                
                <!-- Title -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-semibold tracking-tight mb-2">网站已迁移</h1>
                    <p class="text-zinc-400 text-[15px]">感谢您的支持，我们已更新至最新地址</p>
                </div>
                
                <!-- New Site URL -->
                <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-5 mb-8">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-medium text-zinc-500 tracking-wider">最新官方网站</span>
                        <span class="px-2 py-0.5 bg-emerald-500/10 text-emerald-400 text-[10px] font-medium rounded-full">NEW</span>
                    </div>
                    
                    <a href="https://goofish.win" 
                       target="_blank"
                       class="block text-2xl font-semibold text-blue-400 hover:text-blue-300 site-url transition-colors">
                        https://goofish.win
                    </a>
                </div>
                
                <!-- Countdown -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center gap-2 bg-zinc-950 border border-zinc-800 rounded-2xl px-5 py-3">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-clock text-zinc-400"></i>
                            <div>
                                <span class="text-zinc-400 text-sm">将在</span>
                                <span id="countdown" 
                                      class="countdown-number mx-1.5 text-3xl font-semibold text-white tabular-nums">5</span>
                                <span class="text-zinc-400 text-sm">秒后自动跳转</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="space-y-3">
                    <!-- Primary Button -->
                    <button onclick="redirectNow()"
                            class="modern-button w-full flex items-center justify-center gap-3 bg-white hover:bg-zinc-100 active:bg-zinc-200 text-zinc-950 font-semibold py-4 px-6 rounded-2xl text-[15px] shadow-lg shadow-black/20">
                        <i class="fa-solid fa-external-link-alt"></i>
                        <span>立即访问新网站</span>
                    </button>
                    
                    <!-- Secondary Button -->
                    <button onclick="cancelRedirect()"
                            class="modern-button w-full flex items-center justify-center gap-2 bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-600 text-white font-medium py-3.5 px-6 rounded-2xl text-[14px] border border-zinc-700">
                        <i class="fa-solid fa-times"></i>
                        <span>取消自动跳转</span>
                    </button>
                </div>
                
                <!-- Footer Note -->
                <div class="mt-6 text-center">
                    <p class="text-[11px] text-zinc-500">
                        如果自动跳转失败，请点击上方按钮<br>
                        <span class="text-zinc-600">或直接在浏览器中访问</span> 
                        <a href="https://goofish.win" target="_blank" class="text-blue-400 hover:underline">goofish.win</a>
                    </p>
                </div>
            </div>
            
            <!-- Small branding -->
            <div class="text-center mt-6">
                <p class="text-[10px] text-zinc-600">goofish.win • 最新版本</p>
            </div>
        </div>
    </div>

    <script>
        // Tailwind script
        function initializeTailwind() {
            document.documentElement.style.setProperty('--accent', '#3b82f6');
        }
        
        // Countdown logic
        let secondsLeft = 5;
        let countdownInterval = null;
        let isRedirectCancelled = false;
        
        const countdownElement = document.getElementById('countdown');
        
        function startCountdown() {
            countdownInterval = setInterval(() => {
                if (isRedirectCancelled) return;
                
                secondsLeft--;
                countdownElement.textContent = secondsLeft;
                
                // Add a subtle scale animation on change
                countdownElement.style.transform = 'scale(1.15)';
                setTimeout(() => {
                    if (countdownElement) countdownElement.style.transform = 'scale(1)';
                }, 150);
                
                if (secondsLeft <= 0) {
                    clearInterval(countdownInterval);
                    // Auto redirect
                    window.location.href = 'https://goofish.win';
                }
            }, 1000);
        }
        
        function redirectNow() {
            // Clear any existing interval
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            window.location.href = 'https://goofish.win';
        }
        
        function cancelRedirect() {
            isRedirectCancelled = true;
            
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            // Update UI to show cancelled state
            const container = countdownElement.parentElement.parentElement;
            container.innerHTML = `
                <div class="inline-flex items-center gap-2 bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-3">
                    <div class="flex items-center gap-3 text-emerald-400">
                        <i class="fa-solid fa-check-circle"></i>
                        <span class="font-medium text-sm">已取消自动跳转</span>
                    </div>
                </div>
            `;
            
            // Optional: show a toast
            showToast('已取消自动跳转，您可以手动点击按钮访问');
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 bg-zinc-800 border border-zinc-700 text-white text-sm px-4 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 z-50`;
            toast.innerHTML = `
                <i class="fa-solid fa-info-circle text-blue-400"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.transition = 'all 0.3s ease';
                toast.style.opacity = '0';
                setTimeout(() => toast.parentNode.removeChild(toast), 300);
            }, 2200);
        }
        
        // Keyboard support
        function setupKeyboardSupport() {
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    redirectNow();
                }
                if (e.key.toLowerCase() === 'c' && !isRedirectCancelled) {
                    cancelRedirect();
                }
            });
            
            // Show hint
            setTimeout(() => {
                if (!isRedirectCancelled && secondsLeft > 3) {
                    // Could add a subtle hint but skip for cleanliness
                }
            }, 3000);
        }
        
        // Initialize everything
        function init() {
            initializeTailwind();
            
            // Start countdown after a short delay for better UX
            setTimeout(() => {
                if (!isRedirectCancelled) {
                    startCountdown();
                }
            }, 300);
            
            setupKeyboardSupport();
            
            // Easter egg: click the logo area to speed up countdown (for testing)
            const iconArea = document.querySelector('.fa-globe').parentElement;
            if (iconArea) {
                let clickCount = 0;
                iconArea.addEventListener('click', () => {
                    clickCount++;
                    if (clickCount >= 3) {
                        secondsLeft = 1;
                        countdownElement.textContent = '1';
                        clickCount = 0;
                    }
                });
            }
            
            // Make sure the page is accessible
            console.log('%c[goofish] Redirect page initialized successfully', 'color:#3b82f6');
        }
        
        // Boot the page
        window.onload = init;
        
        // Expose for debugging if needed
        window.goofishRedirect = {
            redirectNow: () => redirectNow(),
            cancel: () => cancelRedirect()
        };
    </script>
</body>
</html>
